name: CI and release

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  LILU_COMMIT: e4748cc081bf060302c7d3c44a643ce1d11b7e1d
  MACKERNELSDK_COMMIT: 05094e5e88cec7caedbfb35e8449ed0db94bf95b
  ZERO_AR_DATE: "1"

jobs:
  build:
    name: Validate, analyze, and build
    runs-on: macos-15
    steps:
      - name: Check out IntelMKLFixup
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out pinned MacKernelSDK source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: acidanthera/MacKernelSDK
          ref: ${{ env.MACKERNELSDK_COMMIT }}
          path: MacKernelSDK
          persist-credentials: false

      - name: Check out pinned Lilu source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: acidanthera/Lilu
          ref: ${{ env.LILU_COMMIT }}
          path: .dependencies/Lilu
          persist-credentials: false

      - name: Validate repository and manifest
        run: |
          git diff --check
          plutil -lint IntelMKLFixup/Info.plist
          clang++ -std=c++14 -Wall -Wextra -Werror -pedantic \
            Tests/PolicyTests/PolicyTests.cpp -o "$RUNNER_TEMP/imklfx-policy-tests"
          "$RUNNER_TEMP/imklfx-policy-tests"
          clang++ -std=c++14 -Wall -Wextra -Werror -pedantic \
            Tests/PolicyTests/CatalogueTests.cpp -o "$RUNNER_TEMP/imklfx-catalogue-tests"
          "$RUNNER_TEMP/imklfx-catalogue-tests"
          swift test -Xswiftc -warnings-as-errors
          swift run imklfx-whitelist validate --manifest whitelist/manifest.json

      - name: Derive reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Make pinned SDK visible to Lilu
        run: |
          ln -s "$GITHUB_WORKSPACE/MacKernelSDK" "$GITHUB_WORKSPACE/.dependencies/Lilu/MacKernelSDK"

      - name: Build pinned Lilu SDK from source
        working-directory: .dependencies/Lilu
        run: |
          xcodebuild -jobs 1 -arch x86_64 -configuration Debug
          test -d build/Debug/Lilu.kext
          ditto build/Debug/Lilu.kext "$GITHUB_WORKSPACE/Lilu.kext"

      - name: Analyze IntelMKLFixup
        run: |
          xcodebuild analyze -jobs 1 -scheme IntelMKLFixup -configuration Debug \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR="$RUNNER_TEMP/clang-analyze-debug"
          xcodebuild analyze -jobs 1 -scheme IntelMKLFixup -configuration Release \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_ANALYZER_OUTPUT=plist-html \
            CLANG_ANALYZER_OUTPUT_DIR="$RUNNER_TEMP/clang-analyze-release"
          test -z "$(find "$RUNNER_TEMP/clang-analyze-debug" "$RUNNER_TEMP/clang-analyze-release" -name '*.html' -print -quit)"

      - name: Build Debug and Release kexts
        run: |
          xcodebuild -jobs 1 -scheme IntelMKLFixup -configuration Debug \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES
          xcodebuild -jobs 1 -scheme IntelMKLFixup -configuration Release \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build userspace tools
        run: swift build -c release -Xswiftc -warnings-as-errors -Xswiftc -gnone

      - name: Assemble release directory
        run: |
          mkdir -p release
          cp build/Debug/*.zip release/
          cp build/Release/*.zip release/
          cp .build/release/imklfx-whitelist release/
          cp whitelist/manifest.json release/whitelist-manifest.json
          cp whitelist/manifest.schema.json release/
          cp whitelist/signature.schema.json release/
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          {
            echo "source_commit=$GITHUB_SHA"
            echo "lilu_commit=$LILU_COMMIT"
            echo "mackernelsdk_commit=$MACKERNELSDK_COMMIT"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            xcodebuild -version
            swift --version
            clang --version
          } > release/BUILD_INFO.txt

      - name: Sign whitelist release asset
        if: github.event_name == 'release'
        env:
          IMKLFX_SIGNING_KEY_ID: ${{ vars.IMKLFX_SIGNING_KEY_ID }}
          IMKLFX_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.IMKLFX_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          .build/release/imklfx-whitelist-sign \
            --manifest release/whitelist-manifest.json \
            --output release/whitelist-manifest.json.sig

      - name: Generate SHA-256 inventory
        working-directory: release
        run: shasum -a 256 * > SHA256SUMS

      - name: Upload workflow artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IntelMKLFixup-${{ github.sha }}
          path: release/
          if-no-files-found: error

  attach-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download authenticated build artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: IntelMKLFixup-${{ github.sha }}
          path: release

      - name: Attach assets to published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
